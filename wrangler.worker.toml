# Cloudflare Workers deployment variant (use with `wrangler deploy -c wrangler.worker.toml`).
name = "miliconfig-worker"
main = "src/index.js"
compatibility_date = "2024-11-06"
migrations_dir = "migrations"

[observability]
enabled = true

[vars]
BRAND = "miliconfig"

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "miliconfig-db"
database_id = "REPLACE-WITH-YOUR-D1-DATABASE-UUID"
