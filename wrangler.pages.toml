# Cloudflare Pages deployment variant.
# Build output must contain `_worker.js` (produced by `npm run build`).
# Deploy with: npm run build && wrangler pages deploy dist -c wrangler.pages.toml
name = "miliconfig"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-06"

[vars]
BRAND = "miliconfig"

[[d1_databases]]
binding = "DB"
database_name = "miliconfig-db"
database_id = "REPLACE-WITH-YOUR-D1-DATABASE-UUID"
