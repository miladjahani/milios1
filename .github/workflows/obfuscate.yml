name: Rebuild deployable Worker artifacts

on:
  workflow_dispatch:

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        run: npm install --no-save javascript-obfuscator terser acorn

      - name: Build and obfuscate
        run: npm run build

      - name: Run test suite
        run: npm test

      - name: Commit rebuilt artifacts
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add _worker.js dist/_worker.js dist/worker.readable.js public/_worker.js
          if git diff --staged --quiet; then
            echo "Artifacts are already up to date."
          else
            git commit -m "chore: rebuild miliconfigOS worker artifacts"
            git push
          fi
