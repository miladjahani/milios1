name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      create_database:
        description: 'Create the D1 database if it does not exist'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    environment: pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Validate schema
        run: node scripts/check-schema.js

      - name: Deploy to Pages (pages.dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME || 'miliconfig-db' }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'miliconfig' }}
        run: |
          node scripts/deploy-pages.js ${{ (github.event_name == 'workflow_dispatch' && inputs.create_database) && '--create-db' || '' }}

      - name: Deployment summary
        if: always()
        run: |
          echo "### Cloudflare Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project: ${{ vars.PAGES_PROJECT || 'miliconfig' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: see the deployer output above (pages.dev may append a suffix if the name is taken)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
